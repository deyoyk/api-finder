<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg: #0f0f12; --surface: #1a1a1f; --surface2: #24242b; --border: #2d2d35; --text: #e4e4e7; --muted: #71717a; --accent: #6366f1; --accent-hover: #818cf8; --danger: #ef4444; --success: #22c55e; }
    * { box-sizing: border-box; }
    body { width: 380px; max-height: 520px; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; font-size: 13px; }
    .header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    .badge { background: var(--surface2); color: var(--muted); padding: 4px 8px; border-radius: 6px; font-size: 12px; }
    .toolbar { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); }
    .toolbar button { padding: 6px 12px; border: none; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: #1f0f12; color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: rgba(239,68,68,0.15); }
    .filter-wrap { padding: 8px 16px; }
    .filter-wrap input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 12px; }
    .list { overflow-y: auto; max-height: 260px; scrollbar-width: thin; scrollbar-color: #4b4b57 transparent; }
    .list-item { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .list-item:hover { background: var(--surface); }
    .list-item .method { font-size: 10px; font-weight: 600; color: var(--accent); min-width: 36px; }
    .list-item .url { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text); }
    .list-item .status { font-size: 11px; color: var(--muted); }
    .list-item .toggle { font-size: 10px; color: var(--muted); margin-left: auto; }
    .footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .footer label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--muted); }
    .footer input[type="checkbox"] { accent-color: var(--accent); }
    .btn-link { background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 6px 0; text-decoration: none; }
    .btn-link:hover { text-decoration: underline; }
    .empty { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 13px; }
    .list-item-expanded { padding: 0; flex-direction: column; align-items: stretch; }
    .list-item-expanded .list-item-summary { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; }
    .list-item-expanded .list-item-summary:hover { background: var(--surface); }
    .list-item-detail { padding: 12px 16px; background: var(--surface2); border-top: 1px solid var(--border); font-size: 11px; max-height: 280px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #4b4b57 transparent; }
    .list-item-detail section { margin-bottom: 12px; }
    .list-item-detail section:last-child { margin-bottom: 0; }
    .list-item-detail h4 { margin: 0 0 6px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .list-item-detail pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, monospace; font-size: 11px; color: var(--text); }
    .list-item-detail .keyval { margin-bottom: 4px; }
    .list-item-detail .keyval strong { color: var(--muted); margin-right: 6px; }
    .list::-webkit-scrollbar,
    .list-item-detail::-webkit-scrollbar { width: 6px; }
    .list::-webkit-scrollbar-track,
    .list-item-detail::-webkit-scrollbar-track { background: transparent; }
    .list::-webkit-scrollbar-thumb,
    .list-item-detail::-webkit-scrollbar-thumb { background: #3a3a45; border-radius: 999px; }
    .list::-webkit-scrollbar-thumb:hover,
    .list-item-detail::-webkit-scrollbar-thumb:hover { background: #4b4b57; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>API Finder</h1>
      <a href="https://github.com/deyoyk/api-finder" target="_blank" style="font-size:11px;color:var(--muted);text-decoration:none;">by <span style="color:var(--accent);">deyo</span></a>
    </div>
    <span class="badge" id="count">0</span>
  </div>
  <div class="toolbar">
    <button type="button" class="btn-primary" id="exportBtn">Export</button>
    <button type="button" class="btn-danger" id="clearBtn">Clear all</button>
  </div>
  <div class="filter-wrap">
    <input type="text" id="filter" placeholder="Filter by URL or method...">
  </div>
  <div class="list" id="list"></div>
  <div class="footer">
  </div>
  <script src="yaml-export.js"></script>
  <script src="popup.js"></script>
</body>
</html>
